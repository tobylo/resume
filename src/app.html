<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
			Browser chrome takes the canvas colour (from src/app.css) of the scheme in use: the
			system's, or the visitor's choice, which turns one tag on for all media and the other off.
		-->
		<meta
			name="theme-color"
			content="#ffffff"
			media="(prefers-color-scheme: light)"
			data-scheme="light"
		/>
		<meta
			name="theme-color"
			content="#121110"
			media="(prefers-color-scheme: dark)"
			data-scheme="dark"
		/>
		<script>
			// Apply the theme before first paint so dark visitors never get a white flash.
			// An explicit choice is stored; otherwise follow the system. Keep in sync with
			// src/lib/theme.svelte.ts.
			(function () {
				let stored = null;
				try {
					stored = localStorage.getItem('theme');
				} catch {
					/* storage blocked: no explicit choice, so the system decides */
				}
				const dark =
					stored === 'dark' ||
					(stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
				if (stored === 'light' || stored === 'dark') {
					document
						.querySelectorAll('meta[name="theme-color"][data-scheme]')
						.forEach(function (meta) {
							meta.media = meta.dataset.scheme === stored ? 'all' : 'not all';
						});
				}
			})();
		</script>
		<script>
			// Cloudflare Web Analytics (cookieless; see /privacy). Pages added this beacon itself;
			// a Worker doesn't, so it lives here. Only the live domain counts, not Previews or
			// workers.dev. The token is the tobylo.dev site's, set up for manual snippet
			// installation: the old Pages site's token is refused from this hostname. The token is
			// public: it ships in every page.
			if (location.hostname === 'tobylo.dev') {
				const beacon = document.createElement('script');
				beacon.defer = true;
				beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js';
				beacon.dataset.cfBeacon = '{"token": "b441081fd98a4fb59c0c6d50bd8b7726"}';
				document.head.appendChild(beacon);
			}
		</script>
		<meta name="author" content="Tobias Lolax" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="contents">%sveltekit.body%</div>
	</body>
</html>
